[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-agent"
version = "0.1.0"
description = "Research assistant for scientific literature"
readme = "README.md"
authors = [
    { name = "Timur Çakmakoğlu", email = "t.cakmakoglu@tutanota.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arxiv>=4.0.0",
    "biopython>=1.87",
    "dspy>=3.2.1",
    "habanero>=2.9.2",
    "pydantic>=2.13.4",
    "semanticscholar>=0.12.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent", "src/datagen", "src/optimize"]

[tool.pytest.ini_options]
addopts = """--cov-report term-missing --cov src/research_agent -ra"""
filterwarnings = [
    "ignore::DeprecationWarning:dspy",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",  # Protocol / abstract method placeholders
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.19",
    "ty>=0.0.53",
]
