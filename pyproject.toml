[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "research-agent"
version = "0.2.0"
description = "Research assistant for scientific literature"
readme = "README.md"
authors = [
    { name = "Timur Çakmakoğlu", email = "t.cakmakoglu@tutanota.com" }
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.14"
dependencies = [
    "biopython>=1.87",  # search index
    "dspy>=3.2.1",
    "habanero>=2.9.2",  # search index
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
generate-queries = "datagen.main:main"

[tool.uv.build-backend]
namespace = true

[tool.pytest.ini_options]
addopts = """--cov-report term-missing --cov src/research_agent -ra"""
filterwarnings = [
    "ignore::DeprecationWarning:dspy",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",  # Protocol / abstract method placeholders
]

[dependency-groups]
dev = [
    "datasets>=5.0.0",
    "mlflow>=3.14.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.19",
    "ty>=0.0.53",
]
